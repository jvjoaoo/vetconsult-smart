<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VetConsult Smart - Cadastro de Usuário</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="icon" type="image/x-icon" href="../assets/icon-logo.svg" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-container">
        <a href="./admin-usuarios.html" class="logo-text">
          <img
            src="../assets/vetconsultsmart_logo.svg"
            alt="VetConsult Smart"
            class="logo"
          />
        </a>

        <nav class="menu">
          <a href="./admin-usuarios.html">Usuários</a>
          <a href="./cadastro-usuario.html">Cadastrar Usuário</a>
          <a href="#">Agendamentos</a>
        </nav>
      </div>
    </header>
    <main>
      <div class="container">
        <div class="header-actions">
          <div>
            <h1>Cadastro de Usuário</h1>
            <p>Preencha os dados para cadastrar um novo usuário.</p>
          </div>

          <a href="./admin-usuarios.html" class="btn-link secondary">Voltar</a>
        </div>

        <section class="form-section">
          <form id="usuarioForm">
            <label for="USR_NAME">Nome</label>
            <input
              type="text"
              id="USR_NAME"
              placeholder="Digite o nome"
              required
            />

            <label for="USR_EMAIL">Email</label>
            <input
              type="email"
              id="USR_EMAIL"
              placeholder="Digite o email"
              required
            />

            <label for="USR_TELEFONE">Contato</label>
            <input
              type="text"
              id="USR_TELEFONE"
              placeholder="(00) 00000-0000"
              maxlength="15"
              required
            />

            <label for="USR_DTNASC">Data de nascimento</label>
            <input type="date" id="USR_DTNASC" required />

            <label for="USR_SENHA">Senha</label>
            <input
              type="password"
              id="USR_SENHA"
              placeholder="Digite a senha"
              required
            />

            <button type="submit">Cadastrar Usuário</button>
          </form>
        </section>
      </div>
    </main>
    <footer class="footer">
      <div class="footer-container">
        <!-- Logo -->
        <div class="footer-logo">
          <img
            src="../assets/vetconsultsmart_logo.svg"
            alt="VetConsult Smart"
            class="logo"
          />
        </div>

        <!-- Redes sociais -->
        <div class="footer-social">
          <a href="#" class="social-icon"></a>
          <a href="#" class="social-icon"></a>
          <a href="#" class="social-icon"></a>
        </div>

        <!-- Links -->
        <div class="footer-links">
          <a href="#">FAQ</a>
          <a href="#">CONTATO</a>
          <a href="#">LOREM</a>
        </div>

        <!-- Copyright -->
        <div class="footer-copy">copyright © | 2026</div>
      </div>
    </footer>

    <script src="../js/cadastro-usuario.js"></script>
  </body>
</html>
