<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | VetConsult Smart</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="icon" type="image/x-icon" href="../assets/icon-logo.svg" />
  </head>
  <body class="auth-page">
    <main class="auth-wrapper">
      <section class="auth-box login-mode" id="authBox">
        <div class="auth-panel auth-panel-left">
          <img
            src="../assets/vetconsultsmart_logo.svg"
            alt="VetConsult Smart"
            class="auth-logo"
          />

          <h2>Bem-vindo!</h2>
          <p>
            Acesse sua conta para acompanhar o cuidado do seu pet com mais
            praticidade.
          </p>

          <button id="showRegister" class="auth-outline-button" type="button">
            Cadastrar-se
          </button>
        </div>

        <div class="auth-panel auth-panel-right">
          <div class="form-slider">
            <div class="form-track">
              <section class="form-screen">
                <h1>Login</h1>
                <p class="auth-subtitle">Entre com seu e-mail e senha</p>

                <form id="loginTutorForm" class="auth-form">
                  <input
                    type="email"
                    id="loginEmail"
                    placeholder="E-mail"
                    required
                  />
                  <input
                    type="password"
                    id="loginSenha"
                    placeholder="Senha"
                    required
                  />
                  <button type="submit" class="auth-primary-button">
                    Entrar
                  </button>
                </form>

                <p class="auth-switch-text">
                  Ainda não tem conta?
                  <button id="showRegisterInline" type="button">
                    Cadastre-se
                  </button>
                </p>

                <p id="loginMessage" class="auth-message"></p>
              </section>

              <section class="form-screen">
                <h1>Cadastro</h1>
                <p class="auth-subtitle">
                  Crie sua conta para acessar o sistema
                </p>

                <form id="registerTutorForm" class="auth-form">
                  <input
                    type="text"
                    id="registerNome"
                    placeholder="Nome completo"
                    required
                  />
                  <input
                    type="text"
                    id="registerCpf"
                    placeholder="CPF"
                    required
                  />
                  <input
                    type="email"
                    id="registerEmail"
                    placeholder="E-mail"
                    required
                  />
                  <input
                    type="text"
                    id="registerTelefone"
                    placeholder="Telefone"
                    required
                  />
                  <input type="date" id="registerDataNascimento" />
                  <input
                    type="password"
                    id="registerSenha"
                    placeholder="Senha"
                    required
                  />
                  <button type="submit" class="auth-primary-button">
                    Cadastrar
                  </button>
                </form>

                <p class="auth-switch-text">
                  Já possui conta?
                  <button id="showLoginInline" type="button">Entrar</button>
                </p>

                <p id="registerMessage" class="auth-message"></p>
              </section>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="../js/pages/login-tutor.js"></script>
  </body>
</html>
