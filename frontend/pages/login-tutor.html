<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | VetConsult Smart</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="icon" type="image/x-icon" href="../assets/icon-logo.svg" />
  </head>
  <body class="auth-page">
    <main class="auth-wrapper">
      <section class="auth-box login-mode" id="authBox">
        <div class="auth-panel auth-panel-left">
          <img
            src="../assets/vetconsultsmart_white-logo.svg"
            alt="VetConsult Smart"
            class="auth-logo"
          />

          <h2 id="sideTitle">Bem-vindo!</h2>
          <p id="sideText">
            Acesse sua conta para acompanhar o cuidado do seu pet com mais
            praticidade.
          </p>

          <a href="#" class="side-panel-btn" id="sideToggleButton">Entrar</a>
        </div>

        <div class="auth-panel auth-panel-right">
          <div class="form-slider">
            <div class="form-track">
              <section class="form-screen">
                <h1>Login</h1>
                <p class="auth-subtitle">Entre com seu e-mail e senha</p>

                <form id="loginTutorForm" class="auth-form">
                  <input
                    type="email"
                    id="loginEmail"
                    placeholder="E-mail"
                    required
                    autocomplete="email"
                  />
                  <input
                    type="password"
                    id="loginSenha"
                    placeholder="Senha"
                    required
                    autocomplete="current-password"
                  />
                  <button type="submit" class="auth-primary-button">
                    Entrar
                  </button>
                </form>

                <p id="loginMessage" class="auth-message"></p>
              </section>

              <section class="form-screen">
                <h1>Cadastro</h1>
                <p class="auth-subtitle">
                  Crie sua conta para acessar o sistema
                </p>

                <form id="registerTutorForm" class="auth-form">
                  <input
                    type="text"
                    id="registerNome"
                    placeholder="Nome completo"
                    required
                    autocomplete="name"
                  />

                  <input
                    type="text"
                    id="registerCpf"
                    placeholder="CPF"
                    required
                    maxlength="14"
                    inputmode="numeric"
                    autocomplete="off"
                  />

                  <input
                    type="email"
                    id="registerEmail"
                    placeholder="E-mail"
                    required
                    autocomplete="email"
                  />

                  <input
                    type="text"
                    id="registerTelefone"
                    placeholder="Telefone"
                    required
                    maxlength="15"
                    inputmode="numeric"
                    autocomplete="tel"
                  />

                  <input
                    type="date"
                    id="registerDataNascimento"
                    required
                  />

                  <input
                    type="password"
                    id="registerSenha"
                    placeholder="Senha"
                    required
                    autocomplete="new-password"
                  />

                  <button type="submit" class="auth-primary-button">
                    Cadastrar
                  </button>
                </form>

                <p id="registerMessage" class="auth-message"></p>
              </section>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="../js/pages/login-tutor.js"></script>
  </body>
</html>
