<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meus Pets | VetConsult Smart</title>

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="icon" type="image/x-icon" href="../assets/icon-logo.svg" />
  </head>

  <body class="dashboard-page">
    <header class="topbar tutor-topbar">
      <div class="topbar-container tutor-topbar-container">
        <a href="./dashboard-tutor.html" class="logo-text">
          <img
            src="../assets/vetconsultsmart_logo.svg"
            alt="VetConsult Smart"
            class="logo"
          />
        </a>

        <nav class="menu tutor-menu">
          <a href="./dashboard-tutor.html" data-page="dashboard">Painel</a>
          <a href="./meus-pets.html" data-page="pets">Meus Pets</a>
          <a href="#" data-page="agendamentos">Agendamentos</a>
          <a href="./perfil-tutor.html" data-page="perfil">Meu Perfil</a>
        </nav>

        <button type="button" class="profile-menu-button" id="openProfileMenu">
          <span class="profile-menu-avatar" id="topbarProfileAvatar">T</span>
          <span class="profile-menu-name" id="topbarProfileName">Tutor</span>
        </button>
      </div>
    </header>
    <div
      class="profile-sidebar-overlay"
      id="profileSidebarOverlay"
      aria-hidden="true"
    ></div>
    <aside
      class="profile-sidebar"
      id="profileSidebar"
      aria-hidden="true"
      aria-labelledby="profileSidebarTitle"
    >
      <div class="profile-sidebar-header">
        <h2 id="profileSidebarTitle">Meu Perfil</h2>

        <button
          type="button"
          class="profile-sidebar-close"
          id="closeProfileMenu"
          aria-label="Fechar menu de perfil"
        >
          ×
        </button>
      </div>

      <div class="profile-sidebar-body">
        <div class="profile-card">
          <div class="profile-avatar" id="profileAvatar">T</div>

          <div class="profile-info">
            <h3 id="profileTutorNome">Tutor</h3>
            <p id="profileTutorEmail">email@exemplo.com</p>
          </div>
        </div>

        <div class="profile-section">
          <h4>Informações da conta</h4>

          <div class="profile-detail-item">
            <span class="label">Nome</span>
            <span class="value" id="profileTutorNomeInfo">-</span>
          </div>

          <div class="profile-detail-item">
            <span class="label">E-mail</span>
            <span class="value" id="profileTutorEmailInfo">-</span>
          </div>
        </div>

        <div class="profile-section">
          <h4>Ações</h4>

          <button type="button" class="sidebar-action-btn" id="editTutorBtn">
            Editar conta
          </button>

          <button
            type="button"
            class="sidebar-action-btn warning"
            id="inactivateTutorBtn"
          >
            Inativar conta
          </button>

          <button
            type="button"
            class="sidebar-action-btn danger-outline"
            id="deleteTutorBtn"
          >
            Deletar conta
          </button>

          <button
            type="button"
            class="sidebar-action-btn danger"
            id="logoutTutorBtn"
          >
            Sair do sistema
          </button>
        </div>
      </div>
    </aside>

    <main>
      <section class="container">
        <div class="header-actions">
          <div>
            <h1>Meus Pets</h1>
            <p id="petsResumoTexto">Carregando pets...</p>
          </div>

          <button type="button" class="btn-primary" id="cadastrarPetBtn">
            Cadastrar novo pet
          </button>
        </div>

        <div id="petsContainer" class="pets-list">
          <div class="empty-pets">
            <div class="empty-pets-icon">🐾</div>
            <h3>Carregando...</h3>
            <p>Estamos buscando os pets cadastrados.</p>
          </div>
        </div>
      </section>
    </main>

        <footer class="footer">
      <div class="footer-container">
        <!-- Logo -->
        <div class="footer-logo">
          <img
            src="../assets/vetconsultsmart_logo.svg"
            alt="VetConsult Smart"
            class="logo"
          />
        </div>

        <!-- Redes sociais -->
        <div class="footer-social">
          <a href="#" class="social-icon"></a>
          <a href="#" class="social-icon"></a>
          <a href="#" class="social-icon"></a>
        </div>

        <!-- Links -->
        <div class="footer-links">
          <a href="#">FAQ</a>
          <a href="#">CONTATO</a>
          <a href="#">LOREM</a>
        </div>

        <!-- Copyright -->
        <div class="footer-copy">
          © 2026 Vetconsult Smart. Todos os direitos reservados.
        </div>
      </div>
    </footer>
    <script src="../js/pages/tutor-menu.js"></script>
    <script src="../js/pages/meus-pets.js"></script>
  </body>
</html>
