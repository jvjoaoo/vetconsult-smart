<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VetConsult Smart - Visualizar Usuário</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="icon" type="image/x-icon" href="../assets/icon-logo.svg" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-container">
        <a href="./admin-usuarios.html" class="logo-text">
          <img
            src="../assets/vetconsultsmart_logo.svg"
            alt="VetConsult Smart"
            class="logo"
          />
        </a>

        <nav class="menu">
          <a href="./admin-usuarios.html">Usuários</a>
          <a href="./cadastro-usuario.html">Cadastrar Usuário</a>
          <a href="#">Pets</a>
          <a href="#">Agendamentos</a>
        </nav>
      </div>
    </header>
    <main class="visualizar-height">
      <div class="container">
        <div class="header-actions">
          <div>
            <h1>Visualizar Usuário</h1>
            <p>Detalhes do usuário cadastrado.</p>
          </div>

          <a href="./admin-usuarios.html" class="btn-link secondary">Voltar</a>
        </div>

        <section class="form-section">
          <p><strong>ID:</strong> <span id="USR_ID"></span></p>
          <p><strong>Nome:</strong> <span id="USR_NAME"></span></p>
          <p><strong>Email:</strong> <span id="USR_EMAIL"></span></p>
          <p><strong>Contato:</strong> <span id="USR_TELEFONE"></span></p>
          <p>
            <strong>Data de nascimento:</strong> <span id="USR_DTNASC"></span>
          </p>
        </section>
      </div>
    </main>
    <footer class="footer">
      <div class="footer-container">
        <!-- Logo -->
        <div class="footer-logo">
          <img
            src="../assets/vetconsultsmart_logo.svg"
            alt="VetConsult Smart"
            class="logo"
          />
        </div>

        <!-- Redes sociais -->
        <div class="footer-social">
          <a href="#" class="social-icon"></a>
          <a href="#" class="social-icon"></a>
          <a href="#" class="social-icon"></a>
        </div>

        <!-- Links -->
        <div class="footer-links">
          <a href="#">FAQ</a>
          <a href="#">CONTATO</a>
          <a href="#">LOREM</a>
        </div>

        <!-- Copyright -->
        <div class="footer-copy">copyright © | 2026</div>
      </div>
    </footer>

    <script src="../js/visualizar-usuario.js"></script>
  </body>
</html>
