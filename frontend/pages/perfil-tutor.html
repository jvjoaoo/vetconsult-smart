<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu Perfil | VetConsult Smart</title>

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="icon" type="image/x-icon" href="../assets/icon-logo.svg" />
  </head>
  <body class="dashboard-page">
    <header class="topbar">
      <div class="topbar-container">
        <a href="./dashboard-tutor.html" class="logo-text">
          <img
            src="../assets/vetconsultsmart_logo.svg"
            alt="VetConsult Smart"
            class="logo"
          />
        </a>

        <nav class="menu">
          <a href="./dashboard-tutor.html">PAINEL</a>
          <a href="./meus-pets.html">MEUS PETS</a>
          <a href="./agendamentos.html">AGENDAMENTOS</a>
          <a href="./perfil-tutor.html" class="active">MEU PERFIL</a>
        </nav>
      </div>
    </header>

    <main class="dashboard-main">
      <section class="dashboard-section profile-page-section">
        <div class="section-header">
          <h2>Editar Conta</h2>
          <a href="./dashboard-tutor.html" class="section-link">Voltar ao painel</a>
        </div>

        <form id="perfilTutorForm" class="profile-form">
          <div class="profile-form-grid">
            <div class="form-group">
              <label for="perfilNome">Nome completo</label>
              <input type="text" id="perfilNome" name="perfilNome" required />
            </div>

            <div class="form-group">
              <label for="perfilCpf">CPF</label>
              <input type="text" id="perfilCpf" name="perfilCpf" required />
            </div>

            <div class="form-group">
              <label for="perfilEmail">E-mail</label>
              <input type="email" id="perfilEmail" name="perfilEmail" required />
            </div>

            <div class="form-group">
              <label for="perfilTelefone">Telefone</label>
              <input type="text" id="perfilTelefone" name="perfilTelefone" required />
            </div>

            <div class="form-group">
              <label for="perfilDataNascimento">Data de nascimento</label>
              <input
                type="date"
                id="perfilDataNascimento"
                name="perfilDataNascimento"
              />
            </div>

            <div class="form-group">
              <label for="perfilNovaSenha">Nova senha</label>
              <input
                type="password"
                id="perfilNovaSenha"
                name="perfilNovaSenha"
                placeholder="Preencha apenas se quiser alterar"
              />
            </div>

            <div class="form-group full-width">
              <label for="perfilConfirmarSenha">Confirmar nova senha</label>
              <input
                type="password"
                id="perfilConfirmarSenha"
                name="perfilConfirmarSenha"
                placeholder="Repita a nova senha"
              />
            </div>
          </div>

          <p id="perfilTutorMessage" class="form-message"></p>

          <div class="profile-form-actions">
            <a href="./dashboard-tutor.html" class="btn-secondary profile-cancel-btn">
              Cancelar
            </a>

            <button type="submit" class="btn-primary">
              Salvar alterações
            </button>
          </div>
        </form>
      </section>
    </main>

    <script src="../js/pages/perfil-tutor.js"></script>
  </body>
</html>
