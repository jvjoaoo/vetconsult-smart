<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu Perfil | VetConsult Smart</title>

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="icon" type="image/x-icon" href="../assets/icon-logo.svg" />
  </head>
  <body class="dashboard-page">
    <header class="topbar tutor-topbar">
      <div class="topbar-container tutor-topbar-container">
        <a href="./dashboard-tutor.html" class="logo-text">
          <img
            src="../assets/vetconsultsmart_logo.svg"
            alt="VetConsult Smart"
            class="logo"
          />
        </a>

        <nav class="menu tutor-menu">
          <a href="./dashboard-tutor.html" data-page="dashboard">Painel</a>
          <a href="./meus-pets.html" data-page="pets">Meus Pets</a>
          <a href="#" data-page="agendamentos">Agendamentos</a>
          <a href="./perfil-tutor.html" data-page="perfil">Meu Perfil</a>
        </nav>

        <button type="button" class="profile-menu-button" id="openProfileMenu">
          <span class="profile-menu-avatar" id="topbarProfileAvatar">T</span>
          <span class="profile-menu-name" id="topbarProfileName">Tutor</span>
        </button>
      </div>
    </header>
    <div
      class="profile-sidebar-overlay"
      id="profileSidebarOverlay"
      aria-hidden="true"
    ></div>
    <aside
      class="profile-sidebar"
      id="profileSidebar"
      aria-hidden="true"
      aria-labelledby="profileSidebarTitle"
    >
      <div class="profile-sidebar-header">
        <h2 id="profileSidebarTitle">Meu Perfil</h2>

        <button
          type="button"
          class="profile-sidebar-close"
          id="closeProfileMenu"
          aria-label="Fechar menu de perfil"
        >
          ×
        </button>
      </div>

      <div class="profile-sidebar-body">
        <div class="profile-card">
          <div class="profile-avatar" id="profileAvatar">T</div>

          <div class="profile-info">
            <h3 id="profileTutorNome">Tutor</h3>
            <p id="profileTutorEmail">email@exemplo.com</p>
          </div>
        </div>

        <div class="profile-section">
          <h4>Informações da conta</h4>

          <div class="profile-detail-item">
            <span class="label">Nome</span>
            <span class="value" id="profileTutorNomeInfo">-</span>
          </div>

          <div class="profile-detail-item">
            <span class="label">E-mail</span>
            <span class="value" id="profileTutorEmailInfo">-</span>
          </div>
        </div>

        <div class="profile-section">
          <h4>Ações</h4>

          <button type="button" class="sidebar-action-btn" id="editTutorBtn">
            Editar conta
          </button>

          <button
            type="button"
            class="sidebar-action-btn warning"
            id="inactivateTutorBtn"
          >
            Inativar conta
          </button>

          <button
            type="button"
            class="sidebar-action-btn danger-outline"
            id="deleteTutorBtn"
          >
            Deletar conta
          </button>

          <button
            type="button"
            class="sidebar-action-btn danger"
            id="logoutTutorBtn"
          >
            Sair do sistema
          </button>
        </div>
      </div>
    </aside>

    <main class="dashboard-main">
      <section class="dashboard-section profile-page-section">
        <div class="section-header">
          <h2>Editar Conta</h2>
          <a href="./dashboard-tutor.html" class="section-link"
            >Voltar ao painel</a
          >
        </div>

        <form id="perfilTutorForm" class="profile-form">
          <div class="profile-form-grid">
            <div class="form-group">
              <label for="perfilNome">Nome completo</label>
              <input type="text" id="perfilNome" name="perfilNome" required />
            </div>

            <div class="form-group">
              <label for="perfilCpf">CPF</label>
              <input type="text" id="perfilCpf" name="perfilCpf" required />
            </div>

            <div class="form-group">
              <label for="perfilEmail">E-mail</label>
              <input
                type="email"
                id="perfilEmail"
                name="perfilEmail"
                required
              />
            </div>

            <div class="form-group">
              <label for="perfilTelefone">Telefone</label>
              <input
                type="text"
                id="perfilTelefone"
                name="perfilTelefone"
                required
              />
            </div>

            <div class="form-group">
              <label for="perfilDataNascimento">Data de nascimento</label>
              <input
                type="date"
                id="perfilDataNascimento"
                name="perfilDataNascimento"
              />
            </div>

            <div class="form-group">
              <label for="perfilNovaSenha">Nova senha</label>
              <input
                type="password"
                id="perfilNovaSenha"
                name="perfilNovaSenha"
                placeholder="Preencha apenas se quiser alterar"
              />
            </div>

            <div class="form-group full-width">
              <label for="perfilConfirmarSenha">Confirmar nova senha</label>
              <input
                type="password"
                id="perfilConfirmarSenha"
                name="perfilConfirmarSenha"
                placeholder="Repita a nova senha"
              />
            </div>
          </div>

          <p id="perfilTutorMessage" class="form-message"></p>

          <div class="profile-form-actions">
            <a
              href="./dashboard-tutor.html"
              class="btn-secondary profile-cancel-btn"
            >
              Cancelar
            </a>

            <button type="submit" class="btn-primary">Salvar alterações</button>
          </div>
        </form>
      </section>
    </main>

        <footer class="footer">
      <div class="footer-container">
        <!-- Logo -->
        <div class="footer-logo">
          <img
            src="../assets/vetconsultsmart_logo.svg"
            alt="VetConsult Smart"
            class="logo"
          />
        </div>

        <!-- Redes sociais -->
        <div class="footer-social">
          <a href="#" class="social-icon"></a>
          <a href="#" class="social-icon"></a>
          <a href="#" class="social-icon"></a>
        </div>

        <!-- Links -->
        <div class="footer-links">
          <a href="#">FAQ</a>
          <a href="#">CONTATO</a>
          <a href="#">LOREM</a>
        </div>

        <!-- Copyright -->
        <div class="footer-copy">
          © 2026 Vetconsult Smart. Todos os direitos reservados.
        </div>
      </div>
    </footer>
    <script src="../js/pages/tutor-menu.js"></script>
    <script src="../js/pages/perfil-tutor.js"></script>
  </body>
</html>
